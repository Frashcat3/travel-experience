<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de roupas do prof Dudu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
    <header>
        <h1>👕 Loja de Roupas 👚</h1>
    </header>
    
    <main class="carrossel">

        <div class="trilho">

            <div class="slide">
                <img src="img/images (2).jpg" alt="camiseta bob esponja">
                <h2>Camiseta</h2>
                <p class="preço">R$ 49,90</p>
            </div>

            <div class="slide">
                <img src="/img/images (3).jpg" alt="calça angelical">
                <h2>Calça</h2>
                <p class="preco">R$ 199,90</p>
            </div>

            <div class="slide">
                <img src="img/images (4).jpg" alt="jaqueta">
                <h2>Jaqueta</h2>
                <p class="preco">R$ 229,90</p>
            </div>

            <div class="slide">
                <img src="img/tnis_lokal_logo_preto_3_20251213174914_677b4d0f76a3.webp" alt="tenis">
                <h2>Tênis</h2>
                <p class="preco">R$ 149,90</p>
            </div>

            <div class="slide">
                <img src="img/608795.webp" alt="vestido">
                <h2>Vestido</h2>
                <p class="preco">169,90</p>
            </div>

        </div>

    </main>

</body>
</html>
